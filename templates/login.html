<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - سوق أولاد جلال</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-white">

    <header class="bg-gradient-to-r from-yellow-600 to-yellow-400 py-4">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <a href="/" class="text-black font-bold text-xl"><i class="fas fa-arrow-right ml-2"></i>الرئيسية</a>
            <h1 class="text-2xl font-bold text-black">تسجيل الدخول</h1>
            <div></div>
        </div>
    </header>

    <div class="container mx-auto px-4 py-12 max-w-md">
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="p-3 rounded-lg mb-4 text-center {% if category == 'success' %}bg-green-600{% else %}bg-red-600{% endif %}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- تسجيل الدخول -->
        <div class="bg-gray-800 rounded-2xl p-8 shadow-xl mb-6">
            <h2 class="text-xl font-bold text-yellow-500 mb-6 text-center">
                <i class="fas fa-sign-in-alt ml-2"></i>تسجيل الدخول
            </h2>
            <form method="post" action="/login" class="space-y-5">
                <div>
                    <label class="block text-yellow-500 mb-2">رقم الهاتف</label>
                    <input type="tel" name="phone" required class="w-full px-4 py-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-yellow-500" placeholder="07XXXXXXXXX">
                </div>
                <div>
                    <label class="block text-yellow-500 mb-2">كلمة المرور</label>
                    <input type="password" name="password" required class="w-full px-4 py-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-yellow-500" placeholder="••••••">
                </div>
                <button type="submit" class="w-full bg-yellow-500 text-black py-3 rounded-lg font-bold text-lg hover:bg-yellow-400 transition">دخول</button>
            </form>
        </div>

        <!-- تسجيل جديد -->
        <div class="bg-gray-800 rounded-2xl p-8 shadow-xl">
            <h2 class="text-xl font-bold text-yellow-500 mb-6 text-center">
                <i class="fas fa-user-plus ml-2"></i>تسجيل جديد
            </h2>
            <form method="post" action="/register" class="space-y-5">
                <div>
                    <label class="block text-yellow-500 mb-2">الاسم الكامل</label>
                    <input type="text" name="name" required class="w-full px-4 py-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-yellow-500" placeholder="أدخل اسمك">
                </div>
                <div>
                    <label class="block text-yellow-500 mb-2">رقم الهاتف</label>
                    <input type="tel" name="phone" required class="w-full px-4 py-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-yellow-500" placeholder="07XXXXXXXXX">
                </div>
                <div>
                    <label class="block text-yellow-500 mb-2">كلمة المرور</label>
                    <input type="password" name="password" required class="w-full px-4 py-3 rounded-lg bg-gray-700 border border-gray-600 focus:outline-none focus:border-yellow-500" placeholder="••••••">
                </div>
                <button type="submit" class="w-full bg-green-600 text-white py-3 rounded-lg font-bold text-lg hover:bg-green-500 transition">إنشاء حساب</button>
            </form>
        </div>
    </div>
</body>
</html>
